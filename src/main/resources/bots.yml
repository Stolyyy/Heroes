# Global bot configuration. Per-hero tuning stays in each hero's yml (ai / strategy /
# recovery sections); this file carries cross-hero tunables.

# Heroes bots never roll and cannot be picked for them in the GUI.
disabled_heroes:
- greenhood
- blud # bow flow is player-packet-driven; bots cannot draw

recovery:
  # Blocks above the nearest sampled stage point the bot aims for so it lands cleanly on stage.
  target_height_offset: 2.5

movement:
  # Cadence in ticks between movement-action reassessments during RECOVER and EVADE.
  action_recheck_ticks: 2

prevention:
  jump_veto: true
  # Extra reach beyond jump trajectory allowed when jumping across a gap onto a target's platform.
  reach_margin: 2.0
  headroom_max_check: 6.0    # FILL: blocks above the bot's head checked for a ceiling before a chase jump

navigation:
  reissue_distance: 2.0
  ring_slack: 3.0
  backpedal_slack: 1.5
  ring_hold_distance: 2.0
  reissue_min_ticks: 10
  velocity_quiet_speed: 0.3
  jump_cooldown_ticks: 8
  chase_jump_height_threshold: 1.5
  stepout_min_radius: 2.0    # FILL: nearest distance from the target's X/Z a step-out point may be
  stepout_max_radius: 7.0    # FILL: how far out from under a platform the bot will look

evade:
  exit_multiplier: 1.3
  flee_min_blocks: 8.0
  flee_max_blocks: 14.0
  flee_candidates: 6
  flee_spread_degrees: 60.0
  aim_distance: 8.0
  aim_height_offset: 1.5

# Difficulty tiers 1-5 cycled per bot in BotSettingsGUI (new bots start at 3).
# input_delay is in ticks between deciding and acting, overriding ai.input_delay.
difficulty:
  "1":
    input_delay: 8
  "2":
    input_delay: 6
  "3":
    input_delay: 4
  "4":
    input_delay: 2
  "5":
    input_delay: 0
