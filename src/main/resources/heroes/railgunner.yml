name: Railgunner
hurt_sound:
  sound: generalcluck.pain
  scope: PLAYER
  cooldown: 0.5 # seconds between hurt sounds
  min_damage: 0 # only for hits dealing at least this much damage
  chance: 1.0 # 0-1 probability the sound plays

stats:
  type: RANGED
  weight: 2.0

combat:
  jab_damage: 2.0

energy:
  starting_energy: 100
  max_energy: 100
  energy_per_tick: 0
  can_increase_energy: true

abilities:
  primary:
    type: railgun
    name: Railgun
    cooldown: 1.5
    damage: 8
    knockback: 2.5
    radius: 0.7
    range: 100
    speed: 5.0
    pierces_players: true
    min_damage: 5
    dropoff_distance: 25
    # Vertical distance from the victim's eye location that still counts as a headshot.
    # hit_loc comes off the victim's AABB grown by `radius`, so this is looser than it reads.
    headshot_tolerance: 0.25 # FILL — tune once the headshot sound makes false positives audible
    visuals:
      fire_sound:
        sound: generalcluck.bazookafire
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
      headshot_sound:
        sound: entity.experience_orb.pickup
        volume: 1.5
        pitch: 2.0
        scope: PLAYER
      projectile_visual:
        type: ITEM_DISPLAY
        model:
          hero: railgunner
          texture: rocket
  
  secondary:
    type: satchel
    name: Satchel
    cooldown: 0.0 # throws are gated by STOCK charges only
    sneak_pop_delay_ticks: 2 # FILL — sneak-thrown satchels auto-detonate after this many ticks
    ammo:
      mode: STOCK
      max: 2
      regen: 4.0 # one charge back every N seconds — FILL/tune
    damage: 3
    knockback: 1.75
    radius: 1.0
    range: 35
    speed: 1.2
    gravity: 0.08
    kb_type: HIT_LOCATION
    satchel:
      min_velocity: 1.0
      max_velocity: 2.0
      duration: 30
      radius: 4.0
    visuals:
      pop_sound:
        sound: entity.generic.explode
        volume: 1.5
        pitch: 1.2
      fire_sound:
        sound: entity.chicken.hurt
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
      projectile_visual:
        type: ITEM_DISPLAY
        model:
          hero: railgunner
          texture: satchel
  
  smash:
    type: clusterbuck
    name: Clusterbuck
    # Held-item swap while ARMED - restored on fire/lapse/death. Only the default-skin
    # launcher key exists in the pack, so the skin is pinned.
    armed_item_texture: grenadelauncher
    armed_item_skin: default
    description: Fire a massive rocket that explodes on contact
    cooldown: 60
    active_duration: 4 # arm window — fire before it lapses or the rocket is lost; FILL/tune
    damage: 16.0
    # Must stay above aoe.knockback: the direct victim is excluded from the splash, so anything
    # lower makes landing the rocket weaker than clipping the ground beside them.
    knockback: 6.5 # FILL — was 4.0, i.e. below the 5.0 splash
    radius: 0.5
    range: 80
    speed: 4.0
    gravity: 0.00
    # Firing recoil, added to current velocity: backwards along the aim, plus a little lift.
    kick: 0.90              # FILL - backwards shove on firing
    kick_y: 0.25            # FILL - upward component of the shove
    pierces_players: false
    pierces_walls: false
    aoe:
      kb_type: HIT_LOCATION   # blast kb radiates from the hit point (default: player positions)
      radius: 5.0
      damage: 16.0
      knockback: 5.0
      # Blast ignores line of sight. Independent of the projectile's pierces_walls above, which
      # only decides whether the rocket stops on the wall. True so a 5-block blast wraps cover
      # instead of being vetoed by the ledge the rocket detonated against.
      pierces_walls: true
      center_visual:
        type: PARTICLE
        shape: SPHERE
        particles:
        - particle: DUST
          color: ORANGE
        - particle: DUST
          color: RED
        - particle: DUST
          color: MAROON
        points: 96
        radius: 5.0
        speed: 1.5
        spread: 0.75
      center_sound:
        sound: entity.generic.explode
        volume: 5.0
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
    visuals:
      activation_sound:
        sound: generalcluck.crystal
        scope: GLOBAL # ult announcement - audible map-wide (sound-scope rework)
        volume: 5.0
      fire_sound:
        sound: generalcluck.bazookafire
        volume: 3.0
        pitch: 0.0
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
      projectile_visual:
        type: ITEM_DISPLAY
        model:
          hero: railgunner
          texture: clusterbuck
      trail_spacing: 2.0
      trail_visual:
        type: PARTICLE
        shape: POINT
        particle: CLOUD
  
  passives:
  - type: headhunter
    name: null
    description: null
    damage_dealt_multiplier: 1.5

skins:
  default:
    armor:
      chest: 226,40,59
      legs: 29,29,33
      boots: 29,29,33
  masterskin:
    armor:
      chest: 0,0,0
      legs: 0,0,0
      boots: 0,0,0

# Unlock economy (B25)
unlock:
  default-unlocked: false
  token-cost: 1
  smash-level-requirement: 0

# Bot config (B28.7) - placeholder values; tune for feel. strategy_type archetype suggested
# from stats.type; ai.* read by BaseBotAI, strategy.* by the Strategy classes.
bot:
  strategy_type: DEFENSIVE
ai:
  min_target_duration: 40 # FILL - ticks a target is kept before re-evaluating
  switch_threshold: 3.0 # FILL - how much closer a new target must be to switch
  search_radius: 100 # FILL - blocks scanned for targets
  speed_modifier: 1.3 # FILL - x the hero's own pace, now with CORRECT math (sqrt-inverted Citizens squaring): 1.0 = walk parity, 1.3 = always-sprinting
  input_delay: 2 # FILL - ticks between bot "inputs"
strategy:
  preferred_distance: 30.0 # FILL - distance the bot tries to hold
  chase_range: 40 # FILL - max distance it will chase
  can_double_jump: true
  panic_distance: 4.0 # FILL - EVADE trigger: a MELEE/HYBRID enemy inside this range makes the bot flee (0 = never)
  far_distance: 100 # FILL - beyond this counts as "far" (primary Railgun range)
  ult_min_target_hp_percent: 0.25  # don't ult a target already below this HP fraction
  ult_min_self_hp_percent: 0.30    # don't ult below this own-HP fraction unless on last life
  ability_ranges:
    primary: 60.0 # FILL - use primary within this range
    secondary: 10.0 # FILL
    smash: 25.0 # FILL
