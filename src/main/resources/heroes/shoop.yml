name: Shoop
hurt_sound:
  sound: shoopdawhoop.pain
  scope: PLAYER
  cooldown: 0.5     # seconds between hurt sounds
  min_damage: 0     # only for hits dealing at least this much damage
  chance: 1.0       # 0-1 probability the sound plays

stats:
  type: RANGED
  weight: 3.0

combat:
  jab_damage: 2.0

energy:
  starting_energy: 100
  max_energy: 100
  energy_per_tick: 0.5
  can_increase_energy: true

abilities:
  primary:
    type: shoopprimary
    name: LAZOR
    cooldown: 0.34
    damage: 2.0
    knockback: 1.0
    radius: 0.75
    range: 100
    speed: 2.5
    pierces_players: true
    visuals:
      fire_sound:
        sound: shoopdawhoop.active
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
      projectile_visual:
        type: ITEM_DISPLAY
        model:
          hero: shoop
          texture: laser
  
  secondary:
    type: shoopsecondary
    name: other laser
    description:
    charges: 1
    range: 100
    radius: 1.0
    pierces_players: true
    ammo:
      mode: POWER
      max: 5
      regen: 0
    charge_damage:
      - 2.0
      - 4.0
      - 7.0
      - 10.0
      - 16.0
    charge_knockback:
      - 1.0
      - 1.5
      - 2.2
      - 3.0
      - 5.0
    charge_levels:
      "1":
        fire_sound:
          sound: shoopdawhoop.chargedbeam.small
        trail_visual:
          type: PARTICLE
          particle: DUST
          color: YELLOW
      "2":
        fire_sound:
          sound: shoopdawhoop.chargedbeam.small
        trail_visual:
          type: PARTICLE
          particle: DUST
          color: GREEN
      "3":
        fire_sound:
          sound: shoopdawhoop.chargedbeam.small
        trail_visual:
          type: PARTICLE
          particle: DUST
          color: BLUE
      "4":
        fire_sound:
          sound: shoopdawhoop.chargedbeam.small
        trail_visual:
          type: PARTICLE
          particle: DUST
          color: PURPLE
      "5":
        fire_sound:
          sound: shoopdawhoop.chargedbeam.big
          volume: 5.0
        trail_visual:
          type: PARTICLE
          shape: ORIENTED_RING
          radius: 0.75
          points: 12
          particles:
            - particle: DUST
              color: RED
            - particle: DUST
              color: WHITE
    visuals:
      trail_spacing: 0.5
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
      hit_visual:
        type: PARTICLE
        particle: EXPLOSION
      wall_visual:
        type: PARTICLE
        particle: EXPLOSION
  
  smash:
    type: shoopsmash
    name: IMA FARMER IN MALAYSIA
    cooldown: 110
    windup: 1.0
    active_duration: 3.0
    damage: 8
    knockback: 2.0
    radius: 2.0
    range: 100
    pierces_players: true
    burst_until_inactive: true
    burst_delay_ms: 50
    # Per-victim re-hit lockout, in TICKS. The beam fires for 60 ticks (3.0s active_duration
    # starting after the 1.0s windup), so this sets damage-per-cast against the 100 HP bar:
    #   3 ticks = 20 hits = 160 dmg | 5 = 12 = 96 | 10 = 6 = 48 | 20 = 3 = 24
    hit_interval_ticks: 20  # FILL
    start_offset: 1.0  # FILL — beam starts this many blocks in front (model filled the screen)
    visuals:
      activation_sound:
        sound: shoopdawhoop.crystal
        scope: GLOBAL # ult announcement - audible map-wide (sound-scope rework)
        volume: 5.0
      fire_sound:
        sound: entity.wither.death
        volume: 0.1
        pitch: 0.0
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
      # Spacing between the beam's segment models, in blocks. ShoopSmash keeps ONE persistent
      # display per segment for the whole cast and teleports them, so this now sets how many
      # entities the beam owns (range / spacing + 1 = 101 at 1.0), not a per-tick spawn/remove
      # count. The model is ~3.6 blocks long, so 2.0 still overlaps ~1.8x and halves that to 51.
      trail_spacing: 1.0
      trail_visual:
        type: ITEM_DISPLAY
        model:
          hero: shoop
          texture: ult
        scale: 0.8
  
  passives:
  - type: shooprtl
    name: null
    description: null
    activation: SNEAK
    cooldown_starts: RESOLVE
    energy_cost: 60
    range: 100
    radius: 2.0
    damage: 5.0
    knockback: 5.0
    speed: 2.0
    pierces_players: true
    reactivation_window_ms: 150
    energy_per_block: 1
    visuals:
      fire_sound:
        sound: shoopdawhoop.active
        volume: 5.0
      projectile_visual:
        type: ITEM_DISPLAY
        model:
          hero: shoop
          texture: rtl
        scale: 1.5

skins:
  default:
    armor:
      chest: 0,158,16
      legs: 32,28,29
      boots: 0,158,16
  masterskin:
    armor:
      chest: 60,19,98
      legs: 32,28,29
      boots: 0,158,16

# Unlock economy (B25): starting-roster hero
unlock:
  default-unlocked: true

# Bot config (B28.7) - placeholder values; tune for feel. strategy_type archetype suggested
# from stats.type; ai.* read by BaseBotAI, strategy.* by the Strategy classes.
bot:
  strategy_type: DEFENSIVE
ai:
  min_target_duration: 40   # FILL - ticks a target is kept before re-evaluating
  switch_threshold: 3.0     # FILL - how much closer a new target must be to switch
  search_radius: 100         # FILL - blocks scanned for targets
  speed_modifier: 1.3 # FILL - x the hero's own pace, now with CORRECT math (sqrt-inverted Citizens squaring): 1.0 = walk parity, 1.3 = always-sprinting
  input_delay: 2            # FILL - ticks between bot "inputs"
# Bot movement kit (shared by RECOVER and EVADE): input slots tried lowest-priority-number
# commit window before the NEXT recovery action. The rocket ride's distance depends on energy —
# deliberately unmodeled: the loop just re-checks after each action and fires the next tool.
movement:
  actions:
  - action: sneak # Return To Ludus — mounts the rideable rocket toward the aim
    priority: 1
    delay_after_ticks: 20 # FILL — the ride needs time to carry before the next decision
    evade_only: true
  - action: jump
    priority: 2
    delay_after_ticks: 8 # FILL
strategy:
  preferred_distance: 24.0  # FILL - distance the bot tries to hold
  chase_range: 40           # FILL - max distance it will chase
  can_double_jump: true
  panic_distance: 5.0 # FILL - EVADE trigger: a MELEE/HYBRID enemy inside this range makes the bot flee (0 = never)
  far_distance: 100 # FILL - beyond this counts as "far" (primary LAZOR range)
  ult_min_target_hp_percent: 0.25  # don't ult a target already below this HP fraction
  ult_min_self_hp_percent: 0.30    # don't ult below this own-HP fraction unless on last life
  ability_ranges:
    primary: 70.0           # FILL - use primary within this range
    secondary: 60.0         # FILL
    smash: 50.0             # FILL
