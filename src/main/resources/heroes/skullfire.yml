name: Skullfire
hurt_sound:
  sound: skullfire.pain
  scope: PLAYER
  cooldown: 0.5 # seconds between hurt sounds
  min_damage: 0 # only for hits dealing at least this much damage
  chance: 1.0 # 0-1 probability the sound plays

stats:
  type: RANGED
  weight: 2.0

combat:
  jab_damage: 2

energy:
  starting_energy: 0
  max_energy: 0
  energy_per_tick: 0
  can_increase_energy: false

mobility:
  type: skullmobility
  jump_cap: 5
  skull_visual:
    type: PARTICLE
    shape: RING
    particle: SMOKE
    points: 16
    radius: 0.5

abilities:
  primary:
    type: skullfiredeagle
    name: Deagle
    description: Fire a pinpoint hitscan shot — sneak to unload a rapid burst.
    cooldown: 0.35 # per-shot interval (cooldown now gates primaries) — FILL/tune
    active_duration: 0.0
    damage: 3
    knockback: 0.9
    radius: 0.8
    range: 100
    pierces_players: false
    shots_while_sneaking: 3
    burst_delay_ms: 150
    min_damage: 2
    dropoff_distance: 30
    ammo:
      mode: CLIP
      max: 7
      regen: 2.2 # reload time (was implicitly = old cooldown) — FILL/tune
      reload_sound:
        sound: melee.reload
        scope: PLAYER   # personal cue - only the shooter hears the reload
    visuals:
      trail_spacing: 0.5
      fire_sound:
        sound: skullfire.magnumshot
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
      trail_visual:
        type: PARTICLE
        particle: CRIT
  
  secondary:
    type: skullfiregrenade
    name: Grenade
    description: Hurl a grenade that explodes on contact, blasting enemies back.
    cooldown: 9.0
    damage: 7.0
    knockback: 4.0
    radius: 0.25
    range: 75
    speed: 2.0
    gravity: 0.08
    aoe:
      damage: 7.0
      knockback: 3.5
      radius: 3.5
      # Blast ignores line of sight. Independent of the projectile's own pierces_walls, which
      # only decides whether the grenade stops on the wall. True because a grenade lands flat on
      # the stage by design, and the wall check then eats everyone recovering below the ledge.
      pierces_walls: true
      center_visual:
        type: PARTICLE
        particle: EXPLOSION_EMITTER
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
      center_sound:
        sound: skullfire.explodegrenade
        volume: 2.0
    visuals:
      fire_sound:
        sound: skullfire.grenadethrow
      hit_sound:
        sound: entity.experience_orb.pickup
        volume: 2.0
        scope: PLAYER
      projectile_visual:
        type: ITEM_DISPLAY
        model:
          hero: skullfire
          texture: grenade
  
  smash:
    type: skullfireblazingdeagle
    name: Blazing Deagle
    description: Expand and refill your clip — stacking hits slows enemies until they are stunned and blasted.
    cooldown: 110.0
    active_duration: 10.0
    bonus_ammo: 5
    original_max_ammo: 7
    # Slot-0 model key swapped in for the duration. Deliberately NOT a skins.ult section:
    # the skin path also re-keys the head, and the pack has no skullfire head case for it.
    # This is the SKIN half of hero_texture_skin — the pack case is skullfire_item_ult.
    ult_item_skin: ult
    movement_slow: 0.02
    gravity_slow: 0.1
    max_stage: 3
    decay_duration: 3
    stun_duration: 0.2
    blast_damage: 2.0
    blast_knockback: 2.0
    visuals:
      activation_sound:
        sound: skullfire.crystal
        scope: GLOBAL # ult announcement - audible map-wide (sound-scope rework)
        volume: 5.0
      ring_visual:
        type: PARTICLE
        particle: FLAME
      ring_spacing: 0.2
      stun_sound:
        sound: block.chain.place
      blast_sound:
        sound: block.chain.break
  
  passives:
  - type: skullfirebullseye
    name: Bullseye
    description: Mid-air Deagle hits grant extra double jumps, and consecutive hits without missing reset Grenade.
    hits_for_reset: 3

skins:
  default:
    armor:
      chest: 30,30,30
      legs: 30,30,30
      boots: 30,30,30
  masterskin:
    armor:
      chest: 30,30,30
      legs: 30,30,30
      boots: 30,30,30

# Unlock economy (B25)
unlock:
  default-unlocked: false
  token-cost: 1
  smash-level-requirement: 0

# Bot config (B28.7) - placeholder values; tune for feel. strategy_type archetype suggested
# from stats.type; ai.* read by BaseBotAI, strategy.* by the Strategy classes.
bot:
  strategy_type: DEFENSIVE
ai:
  min_target_duration: 40 # FILL - ticks a target is kept before re-evaluating
  switch_threshold: 3.0 # FILL - how much closer a new target must be to switch
  search_radius: 100 # FILL - blocks scanned for targets
  speed_modifier: 1.3 # FILL - x the hero's own pace, now with CORRECT math (sqrt-inverted Citizens squaring): 1.0 = walk parity, 1.3 = always-sprinting
  input_delay: 2 # FILL - ticks between bot "inputs"
strategy:
  preferred_distance: 35.0 # FILL - distance the bot tries to hold
  chase_range: 40 # FILL - max distance it will chase
  can_double_jump: true
  panic_distance: 7.0 # FILL - EVADE trigger: a MELEE/HYBRID enemy inside this range makes the bot flee (0 = never)
  far_distance: 100 # FILL - beyond this counts as "far" (primary Deagle range)
  ult_min_target_hp_percent: 0.25  # don't ult a target already below this HP fraction
  ult_min_self_hp_percent: 0.30    # don't ult below this own-HP fraction unless on last life
  ability_ranges:
    primary: 70.0 # FILL - use primary within this range
    secondary: 25.0 # FILL
    smash: 20.0 # FILL
