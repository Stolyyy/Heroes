name: Tinman
hurt_sound:
  sound: tinman.pain
  scope: PLAYER
  cooldown: 0.5 # seconds between hurt sounds
  min_damage: 0 # only for hits dealing at least this much damage
  chance: 1.0 # 0-1 probability the sound plays

stats:
  type: RANGED
  weight: 4.5

combat:
  jab_damage: 2.0

energy:
  starting_energy: 100
  max_energy: 100
  energy_per_tick: 0.5
  can_increase_energy: true

abilities:
  primary:
    type: tinlaser
    name: Pew Pew maker
    cooldown: 0.105 # per-shot interval (cooldown now gates primaries) — FILL/tune
    active_duration: 0.0
    damage: 2.0
    knockback: 0.8
    radius: 1.0
    range: 75
    speed: 2.0
    max_angle: 1
    ammo:
      mode: CLIP
      max: 12
      regen: 2.0 # reload time (was implicitly = old cooldown) — FILL/tune
    visuals:
      fire_sound:
        sound: tinman.blastershot
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
      projectile_visual:
        type: ITEM_DISPLAY
        model:
          hero: tinman
          texture: laser
  
  secondary:
    type: rocketpunch
    name: Rocket Punch
    charges: 5
    damage: 12.0
    knockback: 3.0
    radius: 1.0
    range: 90
    speed: 2.0
    kb_type: HIT_LOCATION
    aoe:
      kb_type: HIT_LOCATION   # blast kb radiates from the hit point (default: player positions)
      damage: 10.0
      knockback: 2.0
      radius: 2.5
      # Blast ignores line of sight. Independent of the projectile's own pierces_walls, which
      # only decides whether the shot stops on the wall.
      pierces_walls: false
      center_visual:
        type: PARTICLE
        particle: EXPLOSION
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
      center_sound:
        sound: melee.explosion
    visuals:
      fire_sound:
        sound: tinman.active
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
      projectile_visual:
        type: ITEM_DISPLAY
        model:
          hero: tinman
          texture: punch
      trail_spacing: 2
      trail_visual:
        type: PARTICLE
        particle: CLOUD
  
  smash:
    type: nukeseekingmissiles
    name: Noob Seeking Missiles
    cooldown: 100.0
    # Counted per enemy PLAYER only — enemy minions are still valid missile targets but do not
    # add to the salvo, or a summoner's minions would triple it.
    missiles_per_enemy: 3
    max_missiles: 12 # hard cap on missiles launched per activation, regardless of enemy count
    launch_height: 40
    speed: 1.2
    aoe_radius: 1.5
    damage: 9
    knockback: 2.0
    max_ticks: 200
    spawn_delay_ticks: 5
    visuals:
      activation_sound:
        sound: tinman.crystal
        scope: GLOBAL # ult announcement - audible map-wide (sound-scope rework)
        volume: 5.0
      missile_model:
        type: ITEM_DISPLAY
        model:
          hero: tinman
          texture: punch
      trail_visual:
        type: PARTICLE
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
      explosion_sound:
        sound: skullfire.explodegrenade
      explosion_visual:
        type: PARTICLE
        particle: EXPLOSION
  
  passives:
  - type: overload
    name: Overload
    description: null
    activation: SNEAK
    energy_cost: 60
    damage: 6.0
    knockback: 2.0
    radius: 3.5
    height: 2.0
    pierces_walls: true
    show_block_wave: false
    launch_x: 1.8
    launch_y: 0.65
    visuals:
      activation_sound:
        sound: tinman.passive
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
      wave_visual:
        type: ITEM_DISPLAY
        model:
          hero: tinman
          texture: overload

skins:
  default:
    armor:
      chest: 195,128,41
      legs: 169,199,163
      boots: 195,128,41
  masterskin:
    armor:
      chest: 255,71,57
      legs: 255,213,61
      boots: 255,71,57
# Unlock economy (B25): starting-roster hero
unlock:
  default-unlocked: true

# Bot config (B28.7) - placeholder values; tune for feel. strategy_type archetype suggested
# from stats.type; ai.* read by BaseBotAI, strategy.* by the Strategy classes.
bot:
  strategy_type: DEFENSIVE
ai:
  min_target_duration: 40 # FILL - ticks a target is kept before re-evaluating
  switch_threshold: 3.0 # FILL - how much closer a new target must be to switch
  search_radius: 100 # FILL - blocks scanned for targets
  speed_modifier: 1.3 # FILL - x the hero's own pace, now with CORRECT math (sqrt-inverted Citizens squaring): 1.0 = walk parity, 1.3 = always-sprinting
  input_delay: 2 # FILL - ticks between bot "inputs"
# Bot movement kit (shared by RECOVER and EVADE): input slots tried lowest-priority-number
# first; delay_after_ticks is the commit window before the NEXT action.
movement:
  actions:
  - action: sneak # Overload - instant launch along the aim, and the blast shoves an attacker away on escape
    priority: 1
    delay_after_ticks: 10 # FILL
  - action: jump
    priority: 2
    delay_after_ticks: 8 # FILL
strategy:
  preferred_distance: 20.0 # FILL - distance the bot tries to hold
  chase_range: 40 # FILL - max distance it will chase
  can_double_jump: true
  panic_distance: 4.0 # FILL - EVADE trigger: a MELEE/HYBRID enemy inside this range makes the bot flee (0 = never)
  far_distance: 75 # FILL - beyond this counts as "far" (primary Pew Pew maker range)
  ult_min_target_hp_percent: 0.25  # don't ult a target already below this HP fraction
  ult_min_self_hp_percent: 0.30    # don't ult below this own-HP fraction unless on last life
  ability_ranges:
    primary: 45.0 # FILL - use primary within this range
    secondary: 30.0 # FILL
    smash: 20.0 # FILL
