name: VoidCrawler
hurt_sound:
  sound: duskcrawler.pain
  scope: PLAYER
  cooldown: 0.5 # seconds between hurt sounds
  min_damage: 0 # only for hits dealing at least this much damage
  chance: 1.0 # 0-1 probability the sound plays

stats:
  type: MELEE
  weight: 2.0

combat:
  jab_damage: 5.0

energy:
  starting_energy: 0
  max_energy: 100
  energy_per_tick: -0.75
  can_increase_energy: true

abilities:
  primary:
    type: voiddash
    name: Spacial Slash
    description: Dash forward in a swift slash, cutting through enemies in your path.
    cooldown: 2.0
    damage: 6.0
    knockback: 2.0
    radius: 1.5
    speed: 3
    duration: 3
    visuals:
      activation_sound:
        sound: melee.sword.meleemiss
      hit_sound:
        sound: melee.sword.meleehit
      dash_visual:
        type: ITEM_DISPLAY
        model:
          hero: voidcrawler
          texture: dash
  
  secondary:
    type: voidteleboom
    name: Telebom
    description: Blink instantly along your aim, exploding at your destination.
    cooldown: 5.0
    damage: 7.0
    knockback: 2.0
    radius: 1.0
    range: 17
    distance_to_teleport_spot: 0.1
    # Burst at the teleport destination (fires on enemy hit, wall contact, and max range)
    aoe:
      radius: 2.25 # FILL
      damage: 5.0 # FILL
      knockback: 1.5 # FILL
      # Blast ignores line of sight. Independent of the projectile's own pierces_walls, which
      # only decides whether the shot stops on the wall. True because distance_to_teleport_spot
      # parks the caster 0.1 off the surface, so this burst always detonates hugging a wall.
      pierces_walls: true
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
    boom_visual:
      type: PARTICLE
      shape: RING
      particle: SMOKE
      points: 16
      radius: 0.5
    visuals:
      fire_sound:
        sound: item.firecharge.use
        volume: 3.0
        pitch: 0.0
      hit_sound:
        sound: entity.experience_orb.pickup
        scope: PLAYER
  
  smash:
    type: voidshadowfury
    name: Shadow Furry
    description: Fill your Void Energy, surge with speed, and cloak nearby enemies in flickering darkness.
    cooldown: 120.0
    active_duration: 9.0
    radius: 40
    speed_buff: 0.24
    # DARKNESS blink: the effect is stripped for the last blink_off_ticks of every
    # blink_period_ticks window, so the victim's screen flickers instead of sitting black.
    # blink_off_ticks 0 = no blink (constant darkness, the old behavior).
    blink_period_ticks: 60 # FILL - full on/off cycle length in ticks (20 = 1s)
    blink_off_ticks: 1 # FILL - ticks per cycle the darkness is removed
    visuals:
      activation_sound:
        sound: duskcrawler.crystal
        scope: GLOBAL # ult announcement - audible map-wide (sound-scope rework)
        volume: 5.0
  
  passives:
  - type: voidenergy
    name: Void Energy
    description: Landing jabs builds Void Energy — the more energy you hold, the harder your attacks hit.
    energy_per_jab: 20
    max_damage_dealt_multiplier: 1.25

skins:
  default:
    armor:
      chest: 199,219,236
      legs: 4,4,43
      boots: 202,22,22
  masterskin:
    armor:
      chest: 202,22,22
      legs: 34,34,34
      boots: 202,22,22

# Unlock economy (B25)
unlock:
  default-unlocked: false
  token-cost: 1
  smash-level-requirement: 0

# Bot config (B28.7) - placeholder values; tune for feel. strategy_type archetype suggested
# from stats.type; ai.* read by BaseBotAI, strategy.* by the Strategy classes.
bot:
  strategy_type: AGGRESSIVE
ai:
  min_target_duration: 40 # FILL - ticks a target is kept before re-evaluating
  switch_threshold: 3.0 # FILL - how much closer a new target must be to switch
  search_radius: 100 # FILL - blocks scanned for targets
  speed_modifier: 1.3 # FILL - x the hero's own pace, now with CORRECT math (sqrt-inverted Citizens squaring): 1.0 = walk parity, 1.3 = always-sprinting
  input_delay: 2 # FILL - ticks between bot "inputs"
# Bot movement kit (shared by RECOVER and EVADE): input slots tried lowest-priority-number
# first; delay_after_ticks is the commit window before the NEXT action.
movement:
  actions:
  - action: secondary # Teleboom - guaranteed ~17-block blink along the aim (teleports on hit, wall AND expire)
    priority: 3
    delay_after_ticks: 10 # FILL
  - action: primary # Void Dash, ~9 blocks
    priority: 2
    delay_after_ticks: 10 # FILL
  - action: jump
    priority: 1
    delay_after_ticks: 8 # FILL
strategy:
  preferred_distance: 2.5 # FILL - distance the bot tries to hold
  chase_range: 30 # FILL - max distance it will chase
  can_double_jump: true
  far_distance: 12 # FILL - beyond this counts as "far"
  ult_min_target_hp_percent: 0.25  # don't ult a target already below this HP fraction
  ult_min_self_hp_percent: 0.30    # don't ult below this own-HP fraction unless on last life
  ability_ranges:
    primary: 7.0 # FILL - use primary within this range
    secondary: 14.0 # FILL
    smash: 10.0 # FILL
