# Leaderboard Display (text display entity stack in lobby)
leaderboard:
  enabled: true
  entries: 10
  line-spacing: 0.3
  location:
    world: world
    x: 0.5
    y: 4.5
    z: 509.5
  # {mode} is substituted per stack ("1v1" / "2v2"), which is how each viewer can tell
  # which board they are looking at after toggling. Keep it single-line: the title sits
  # exactly at location and a second line would grow down into row 1 at this spacing.
  title: "<gold><bold>TOP 10</bold></gold> <dark_gray>|</dark_gray> <yellow><bold>{mode}</bold></yellow>"

# Level Leaderboard Display (separate board from the elo one; default view = overall smash level,
# right-click steps forward through the hero list, left-click steps back)
level-leaderboard:
  enabled: true
  entries: 10
  line-spacing: 0.3
  location:
    world: world
    x: -12.5        # FILL - placed a few blocks beside the elo board; move to taste
    y: 4.5
    z: 492.5
  # {view} is substituted per stack ("Overall" or the hero's display name).
  title: "<gold><bold>TOP 10</bold></gold> <dark_gray>|</dark_gray> <aqua><bold>{view} Level</bold></aqua>"

# Lobby Sidebar (scoreboard shown to players in lobby)
sidebar:
  title: "<gold>SMASH HEROES</gold>"

# Lobby plaques: one multi-line text display per entry (MiniMessage). Used for season placements,
# achievement memorials, tournament winners and cosmetic-hall labels. Empty list = nothing spawns.
# memorials:
#   - world: world
#     x: 10.5
#     y: 5
#     z: 520.5
#     lines:
#       - "<gold><bold>SEASON 1</bold></gold>"
#       - "<yellow>#1</yellow> <white>PlayerName</white> <gray>2143 elo</gray>"
memorials: []

# Skin Museum / cosmetic hall: one row per non-admin hero, spawned on enable (not rebuilt on
# /balance reload — a restart picks up newly added skins). Set enabled: true after fitting coordinates.
museum:
  enabled: false
  world: world
  origin: { x: 0.5, y: 0.0, z: 0.5 }   # FILL: first pedestal of the first hero row
  yaw: 180.0                           # FILL: which way every stand faces
  skin-step: { x: 2.0, z: 0.0 }        # FILL: offset from one skin to the next within a row
  hero-step: { x: 0.0, z: 3.0 }        # FILL: offset from one hero's row to the next
