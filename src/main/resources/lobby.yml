# Lobby Configuration
# Lobby spawn, NPCs, leaderboard display, and sidebar settings

lobby:
  spawn:
    world: world
    x: 0.5
    y: 0.0
    z: 500.5
    yaw: 0.0
    pitch: 0.0

# NPC Configuration
# Each NPC has: name (with color codes), location, armor, and hero mapping

announcer:
  name: "<gradient:gold:yellow>Lobby Menu</gradient>"
  location:
    world: world
    x: 0.5
    y: 0
    z: 494.5
    yaw: 180
    pitch: 0
  skin: "MHF_Steve"

# Queue NPCs — one per joinable mode; three text layers above each (mode / playing / waiting).
# Clicking toggles the ranked queues; the custom NPC routes through the normal custom-join flow.
queue-npcs:
  1v1:
    name: "<gold><bold>1v1</bold></gold>"
    skin: "MHF_Steve"   # FILL - skin username
    location:
      world: world
      x: -13.5            # FILL - placed near the announcer; move to taste
      y: 1
      z: 499.5
      yaw: 180
      pitch: 0
