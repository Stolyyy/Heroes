# Prefix for all game messages
prefix: "&8[&6Heroes&8] "

# Join/Leave Messages
join:
  spectating: "&aYou are now spectating &e{player}&a's game."
  cannot-spectate: "&cThat player is not in an active game."
  party-required: "&cYou must be in a party to start a custom game."
  party-too-large: "&cYour party is too large for this mode (max {max} players)."
  party-wrong-size-2v2: "&cYou must be in a party of 2 to join 2v2."
  no-party-1v1: "&cYou cannot join 1v1 while in a party."

# Game State Messages
game:
  eliminated: "&cYou have been eliminated!"
  out-of-bounds: "&cYou went out of bounds!"
  force-ended: "&cGame force-ended by an admin."
  random-hero-assigned: "&eNo hero selected — you're playing {hero}."
  respawning: "&eRespawning in &c{seconds} &eseconds..."
  countdown: "&eGame starting in &c{seconds}&e..."
  started: "&aThe game has started!"

# Game End Messages
end:
  stats:
    # Header line; hover shows team + XP per hero. {hero} {duration} (m:ss)
    header: "&6&lYour game &8- &e{hero} &7played for &f{duration}"
    header-team: "&7Team: &f{team}"
    header-xp: "&7{hero}: &a+{xp} XP"
    # {kills} {deaths}
    kills-deaths: "&7Kills: &a{kills} &8| &7Deaths: &c{deaths}"
    # Hover lines: first void damage, then the top 3 abilities by damage.
    damage-dealt: "&7Damage dealt: &c{damage} &8(hover)"
    dealt-void: "&7Void damage: &5{void_damage} &8(on top of the total)"
    # {rank} {ability} {damage} {share} (percent of total damage dealt)
    dealt-ability: "&7{rank}. &f{ability} &c{damage} &8({share}%)"
    damage-taken: "&7Damage taken: &c{damage} &8(hover)"
    taken-void: "&7Void damage taken: &5{void_damage}"
  victory:
    title: "&6&lVICTORY"
    subtitle: "&e{team} &awins!"
    chat:
      - "&8&m─────────────────────────────────"
      - "&6&lGAME OVER"
      - ""
      - "&aWinner: &e{team} &7- &f{team_players}"
      - ""
      - "&7Top Players:"
      - "&e1. &f{top1_name} &7- &a{top1_kills} kills"
      - "&e2. &f{top2_name} &7- &a{top2_kills} kills"
      - "&e3. &f{top3_name} &7- &a{top3_kills} kills"
      - ""
      - "&8&m─────────────────────────────────"

  defeat:
    title: "&c&lDEFEAT"
    subtitle: "&e{team} &cwins!"

  draw:
    title: "&e&lDRAW"
    subtitle: "&7No winner this time!"
    chat:
      - "&8&m─────────────────────────────────"
      - "&e&lDRAW"
      - "&7The game ended in a tie!"
      - "&8&m─────────────────────────────────"

# ELO Messages
elo:
  gain: "&aELO: &e{old} &7-> &a{new} &7(&a+{change}&7)"
  loss: "&cELO: &e{old} &7-> &c{new} &7(&c{change}&7)"

# Progression Messages
progression:
  # Server-wide broadcast when a player hits the master-skin level on a hero.
  # {player} = player name, {hero} = hero display name, {level} = master-skin level
  master-skin-broadcast: "&d&lMASTER! &e{player} &7has mastered &6{hero} &7(Level {level})!"

# Scoreboards & In-Game Visuals (MiniMessage)
scoreboard:
  lobby:
    title: "<gold><bold>SMASH HEROES"
    below-name-symbol: "<gold>✫"
    smash-level: "<gold>Smash Level: <white>{value}"
    1v1-elo: "<yellow><bold>1v1 ELO: </bold><white>{value}"
    1v1-wins: "<green>1v1 Wins: <white>{value}"
    1v1-kills: "<green>1v1 Kills: <white>{value}"
    2v2-elo: "<yellow><bold>2v2 ELO: </bold><white>{value}"
    2v2-wins: "<green>2v2 Wins: <white>{value}"
    2v2-kills: "<green>2v2 Kills: <white>{value}"
    hero: "<aqua>Hero: <white>{value}"
    hero-none: "None"
    tokens: "<aqua>Tokens: <white>{value}"
  game:
    title: "<gold>SMASH HEROES 4"
    tab-header: "<gold>SMASH HEROES 4"
    health-symbol: "❤"
    countdown-go: "<green>GO!"
    countdown-started: "<white>Match Started"
    victory-title: "<gold>VICTORY!"
    defeat-title: "<red>DEFEAT"
    respawn-countdown: "<red>Respawning in <white>{seconds}"
    respawn-done-title: "<yellow>Welcome Back!"
    respawn-done-subtitle: "<green>Go!"
    time-line: "<yellow>Time: {time}"
    spectators-header: "<gray>Spectators"
    spectator-entry: "<dark_gray>- {player}"

# Queue Messages
queue:
  title: "&e{mode} &7({count}/{max})"
  subtitle: "&7Queue time: &f{time}"
  joined: "&aYou joined the {mode} queue!"
  left: "&cYou left the queue."
  match-found: "&aMatch found! Starting game..."
  already-queued: "&cYou are already in queue for {mode}!"
  cannot-queue-in-game: "&cYou cannot queue while in a game!"
  cannot-queue-in-party: "&cYou cannot queue for 1v1 while in a party. Use &f/party leave&c first."
  no-party-1v1: "&cYou cannot join 1v1 while in a party."
  leader-only: "&cOnly the party leader can queue."
  left-mode: "&cYou left the {mode} queue."
  not-in-queue: "&cYou are not in the {mode} queue."
  party-wrong-size-2v2: "&cYour party is too large for 2v2 (2 players max). Use &f/party leave&c or start a custom game."
  afk-warning: "&eStill there? &7You'll leave the queue in &c{seconds}s &7unless you move."
  afk-warning-title: "&c&lAFK?"
  afk-warning-subtitle: "&eLeaving queue in &c{seconds}s &e- move to stay"
  afk-removed: "&cRemoved from the queue after {seconds}s without input. &7Use &f/join &7when you're back."
  afk-party-removed: "&c{player} went AFK, so your party left the queue."

  # Auto-queue (/autoqueue <1v1|2v2|stop>). The countdown title is shown to the whole party, so
  # each subtitle has a -party twin worded for the members who did not arm it.
  auto:
    enabled: "&aAuto-queue on for &e{mode}&a. Use &f/autoqueue stop &ato cancel."
    disabled: "&cAuto-queue off."
    not-active: "&cAuto-queue is not running."
    status: "&aAuto-queue is on for &e{mode}&a. Use &f/autoqueue stop &ato cancel."
    stopped-error: "&cAuto-queue stopped — could not join the {mode} queue."
    stopped-afk: "&cAuto-queue stopped — you went AFK. &7Use &f/autoqueue <mode> &7to re-arm."
    title: "&aQueueing in &e{seconds}"
    subtitle: "&7{mode} &8| &f/autoqueue stop"
    subtitle-party: "&7{mode} &8| &7queued by &f{player}"
    paused-title: "&eAuto-queue paused"
    paused-subtitle: "&7Close your menu to resume"
    paused-subtitle-party: "&7Waiting on a menu in your party"

  # Clickable line sent on returning to the lobby after a ranked game. The labels live here; the
  # click and hover are attached in Java, because '&' codes cannot carry either.
  requeue:
    prompt: "&7Want another?"
    join-button: "&a&l[JOIN {mode}]"
    join-hover: "&7Click to queue for &f{mode}&7."
    auto-button: "&e[AUTO-QUEUE]"
    auto-hover: "&7Click to requeue for &f{mode}&7 automatically after every game."
    auto-active: "&7Auto-queueing for &f{mode}&7..."
    cancel-button: "&c&l[CANCEL]"
    cancel-hover: "&7Click to stop auto-queue."

# Error Messages
error:
  map-not-found: "&cMap configuration not found for '{map}'."
  invalid-property: "&cUnknown property '{property}'."
  invalid-index: "&cInvalid index '{index}'. Maximum is {max}."
  invalid-material: "&cInvalid material name '{material}'."
  invalid-gamemode: "&cInvalid gamemode '{mode}'."
  no-maps-available: "&cNo maps available for this game mode."

# Chat primer sent one second after a player lands in the lobby. first-join goes to accounts the
# server has never seen (hasPlayedBefore), every-join to everyone else. {player} is their name.
# Either list may be emptied to send nothing. Lines use & colour codes like the rest of this file.
onboarding:
  first-join:
    - "&8&m─────────────────────────────────"
    - "&6&lWelcome to Smash Heroes, &e{player}&6&l!"
    - "&7Open beta: expect bugs, and tell us about them."
    - ""
    - "&e&lHOW TO PLAY"
    - "&7Pick a hero and knock the other team off the map."
    - "&7Damage makes you &cfly further&7. At 0 HP you are not dead, just easy to launch."
    - ""
    - "&e&lCONTROLS"
    - "&fLeft click &7- jab (melee hit)"
    - "&fRight click &7- fire your primary (hotbar slot 1)"
    - "&fSlots 2 / 3 &7- secondary / ultimate"
    - "&fJump in mid-air &7- double jump"
    - "&fQ &7- reload or your hero's passive"
    - "&fSneak / F &7- hero-specific extras (check the hero's item lore)"
    - ""
    - "&e&lCOMMANDS"
    - "&f/hero &7- pick a hero      &f/practice &7- hit dummies and learn a kit"
    - "&f/join 1v1 &7or &f/join 2v2 &7- ranked queue   &f/party invite <name> &7- play with friends"
    - "&f/join custom &7- private game with your party"
    - "&f/stats &7- your stats      &f/lb &7- leaderboards      &f/l &7- back to lobby"
    - "&f/stuck &7- if you ever get stuck"
    - ""
    - "&7Walk up to the &6Lobby Menu &7NPC or the queue NPCs to do all of this with clicks."
    - "&8&m─────────────────────────────────"
  every-join:
    - "&6Welcome back, &e{player}&6. &7/join 1v1 &8| &7/join 2v2 &8| &7/practice &8| &7/stats"

# Restart Messages
restart:
  # Rejection for /join, /autoqueue and any other join while a restart is pending.
  queue-closed: "&cThe server is restarting soon, so queues and new games are closed."

  # Sent (chat + title) to everyone who was queued or had auto-queue armed when the drain began.
  queue-dropped: "&eThe server is restarting soon. You were removed from the queue."
  queue-dropped-title: "&eQueue closed"
  queue-dropped-subtitle: "&7The server is restarting soon"

  # Chat to every player when a drain starts. {seconds} = drain-cap-seconds.
  drain-announce: "&6&lRESTART &eThe server will restart once ranked matches finish (at most {seconds}s). Queues are closed."

  # Chat to every player inside a custom game when a drain starts. {seconds} = drain-cap-seconds.
  custom-game-warning: "&cThis custom game will be ended when the restart begins, in at most {seconds}s."

  # Final countdown, shown at 30/10/5/4/3/2/1 seconds (and at the start). {seconds} = seconds left.
  countdown: "&6&lRESTART &eThe server restarts in &f{seconds}s&e."
  countdown-title: "&6&lRESTARTING"
  countdown-subtitle: "&eServer restarts in &f{seconds}s"

  # Feedback to whoever ran the command.
  admin-drain-started: "&aDrain started: queues closed, waiting for ranked matches."
  admin-now-started: "&aRestart countdown started."
  admin-already: "&cA restart is already in progress."

# Chat Format
chat:
  # Prefix before the sender's name in chat. {level} = Smash Level.
  level-prefix: "&7[&6{level}&7] "

tablist:
  # Suffix after the player name for anyone in a live game. Placeholders until resource-pack font
  # glyphs replace them.
  glyph:
    1v1: "⚔"
    2v2: "⚔⚔"
    custom: "✦"

# Auto-Spectate Messages
autospectate:
  # Refreshed every 20 ticks while armed and in the lobby
  actionbar: "&7Currently autospectating: &f{player}"

custom-gui:
  # Hotbar given to the host after closing the custom game GUI with Escape (WAITING only)
  hotbar:
    reopen:
      name: "&6Reopen Game Setup"
      lore:
        - "&7Right-click to reopen the setup menu"
    start:
      name: "&aStart Game"
      lore:
        - "&7Right-click to start the game"
    cancel:
      name: "&cCancel Game"
      lore:
        - "&7Right-click to cancel and return to the lobby"

party:
  ready:
    not-in-party: "&cYou are not in a party."
    not-leader: "&cOnly the party leader can do that."
    no-active-check: "&cThere is no active ready check."
    already-voted: "&eYou have already answered this ready check."
    started: "&aReady check sent for &e{mode}&a. &7(/party ready force to join anyway, /party ready cancel to stop)"
    prompt: "&e{leader} wants to join &6{mode}&e. Ready?"
    yes-button: "&a[Yes]"
    no-button: "&c[No]"
    accepted: "&a{player} is ready. &7Waiting on: &f{pending}"
    declined: "&c{player} is not ready. Ready check cancelled."
    all-ready: "&aEveryone is ready! Joining..."
    forced: "&eThe leader forced the join."
    cancelled: "&eReady check cancelled."
    expired: "&cThe ready check expired."

# Map Skip Poll (/skipmap)
poll:
  skipmap:
    started: "&e{leader} &7started a map-skip poll!"
    ended: "&7The map-skip poll has ended."
    timed-out: "&7The map-skip poll timed out."
    not-leader: "&cOnly the custom game leader can start or end a map-skip poll."
    already-running: "&cA map-skip poll is already running."
    no-poll: "&cThere is no active map-skip poll."
    not-participant: "&cYou are not in this poll's game."
    none: "None"
    skip-button: "&a&l[SKIP]"
    keep-button: "&c&l[KEEP]"
    tally:
      - "&6&lMap Skip Poll &7({skip_count}/{total} - {percent}%)"
      - "&aSkip: &f{skip}"
      - "&cKeep: &f{keep}"
      - "&7Pending: &f{pending}"

# Chat Input Prompts (MiniMessage)
prompt:
  int-hint: "<gray>Type a number in chat, or 'cancel' to go back."
  double-hint: "<gray>Type a number in chat, or 'cancel' to go back."
  text-hint: "<gray>Type your answer in chat, or 'cancel' to go back."
  cancelled: "<gray>Cancelled."
  not-a-number: "<red>'{input}' is not a number — try again, or type 'cancel'."
  clamped: "<gray>Clamped to {value} (allowed: {min}-{max})."

# Lobby Displays & NPCs (MiniMessage)
visual:
  npc:
    level-tag: "<gold>✫ <white>{level}/{cap}"
  board:
    elo-value: "<yellow> - {value}"
    elo-label: "<gold>Leaderboard: {mode}"
    level-value: "<yellow> - Lv. {value}"
    level-label: "<gold>Level Leaderboard: {view}"
    level-overall: "Overall"
  museum:
    line-1: "<white><bold>{skin}</bold></white>"
    line-2: "<gray>{hero}</gray> {rarity}"

# GUIs (MiniMessage)
gui:
  common:
    token-singular: "token"
    token-plural: "tokens"
    all: "All"
    unknown-player: "Unknown"
  nav:
    back: "<white>Back"
    close: "<red>Close"
    prev-page: "<white>Previous Page"
    next-page: "<white>Next Page"

  settings:
    preferences:
      title: "Player Settings"
      chat-pings:
        "on": "<green>Chat Pings: Enabled"
        on-lore:
          - "<gray>Highlight and play a sound when"
          - "<gray>someone mentions <yellow>@you <gray>in chat."
          - ""
          - "<yellow>Click to disable"
        "off": "<red>Chat Pings: Disabled"
        off-lore:
          - "<gray>Mentions of <yellow>@you <gray>appear"
          - "<gray>normally with no sound."
          - ""
          - "<yellow>Click to enable"
    player:
      team-title: "{team} Team Settings"
      player-title: "Player Settings: {player}"
      lives:
        name: "<gold>{value} Lives"
        lore:
          - "<gray>Left-click: cycle"
          - "<gray>Right-click: enter amount"
        prompt: "Enter the number of lives ({min}-{max}):"
      health:
        name: "<gold>Starting Health: {value}"
        lore:
          - "<gray>Left-click: cycle"
          - "<gray>Right-click: enter amount (0-1000)"
        prompt: "Enter the starting health ({min}-{max}):"
      ultimates:
        "on": "<green>Ultimates: Enabled"
        on-lore: []
        "off": "<red>Ultimates: Disabled"
        off-lore: []
      friendly-fire:
        "on": "<green>Friendly Fire: Enabled"
        on-lore: []
        "off": "<red>Friendly Fire: Disabled"
        off-lore: []
      random-heroes:
        "on": "<green>Random Heroes: Enabled"
        on-lore: []
        "off": "<red>Random Heroes: Disabled"
        off-lore: []
      hero-display:
        override-name: "<green>{hero} (override)"
        random-name: "<light_purple>Random"
        selected-name: "<gold>{hero}"
        none-selected: "<gold>None selected"
        lore:
          - "<gray>Hero this game"
      change-hero:
        name: "<green>Change Hero"
        lore:
          - "<gray>Left-click: pick an override hero"
          - "<gray>Right-click: reset to their selection"

    game:
      title: "Game Settings"
      crystals:
        "on": "<green>Smash Crystals: Enabled ({interval}s)"
        "off": "<red>Smash Crystals: Disabled"
        lore:
          - "<gray>Left-click: toggle"
          - "<gray>Right-click: set spawn interval"
        prompt: "Enter the crystal spawn interval in seconds ({min}-{max}):"
      walls:
        "on": "<green>Kill Walls: Enabled"
        on-lore: []
        "off": "<red>Kill Walls: Disabled"
        off-lore: []
      timer:
        name: "<gold>Match Timer: {value}"
        lore:
          - "<gray>Left-click: cycle presets"
          - "<gray>Right-click: enter seconds"
        prompt: "Enter the match timer in seconds ({min}-{max}):"

    ironman:
      title: "Ironman Settings"
      stocks:
        name: "<gold>Stocks Per Round: {value}"
        lore:
          - "<gray>Left-click: cycle"
          - "<gray>Right-click: enter amount"
        prompt: "Enter stocks per round ({min}-{max}):"
      team-scope:
        "on": "<green>Win Scope: Whole Team"
        on-lore:
          - "<gray>Every member of a team must"
          - "<gray>clear their heroes to win."
        "off": "<red>Win Scope: First Player"
        off-lore:
          - "<gray>First player to clear wins the"
          - "<gray>series for their team."
      heroes:
        name: "<gold>Heroes To Clear: {value}"
        lore:
          - "<gray>Win a round with this many"
          - "<gray>heroes to win the series"
          - "<dark_gray>Left-click: cycle | Right-click: enter"
        prompt: "Enter the number of heroes to clear ({min}-{max}):"

    nuzlocke:
      title: "Nuzlocke Settings"
      team-scope:
        "on": "<green>Team Exhaustion: Enabled"
        on-lore:
          - "<gray>One player out of heroes puts"
          - "<gray>their whole team out."
        "off": "<red>Team Exhaustion: Disabled"
        off-lore:
          - "<gray>Players drop out individually."
      stocks:
        name: "<gold>Stocks Per Round: {value}"
        lore:
          - "<gray>Left-click: cycle"
          - "<gray>Right-click: enter amount"
        prompt: "Enter stocks per round ({min}-{max}):"
      hp-carryover:
        "on": "<green>HP Carry-Over: Enabled"
        on-lore:
          - "<gray>Surviving heroes keep their HP"
          - "<gray>into the next round"
        "off": "<red>HP Carry-Over: Disabled"
        off-lore: []
      lock-in:
        "on": "<green>Lock-In: Enabled"
        on-lore:
          - "<gray>You keep playing your hero"
          - "<gray>until it dies"
        "off": "<red>Lock-In: Disabled"
        off-lore: []
      heroes:
        name: "<gold>Heroes To Eliminate: {value}"
        lore:
          - "<gray>Lose this many heroes and"
          - "<gray>you're out of the series"
          - "<dark_gray>Left-click: cycle | Right-click: enter"
        prompt: "Enter the number of heroes to eliminate ({min}-{max}):"

    tdm:
      title: "Team Deathmatch Settings"
      kill-limit:
        name: "<gold>Kill Limit: {value}"
        lore:
          - "<gray>Left-click: cycle"
          - "<gray>Right-click: enter amount"
        prompt: "Enter the kill limit ({min}-{max}):"
      start-hp:
        name: "<gold>Start HP: {value}"
        lore:
          - "<gray>Left-click: cycle"
          - "<gray>Right-click: enter amount"
        prompt: "Enter the starting HP ({min}-{max}):"
      hero-repick:
        "on": "<green>Hero Re-Pick on Respawn: Enabled"
        on-lore: []
        "off": "<red>Hero Re-Pick on Respawn: Disabled"
        off-lore: []
      ult-carryover:
        "on": "<green>Ult Charge Carryover: Enabled"
        on-lore:
          - "<gray>Smash charge % carries across hero swaps"
        "off": "<red>Ult Charge Carryover: Disabled"
        off-lore:
          - "<gray>Each new hero starts its ult from zero"

    evolution:
      title: "Evolution Settings"
      team-advance:
        "on": "<green>Team Advance: Enabled"
        on-lore:
          - "<gray>A kill advances every teammate"
        "off": "<red>Team Advance: Disabled"
