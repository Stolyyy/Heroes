          - "<gray>Only the killer advances"
      kill-limit:
        name: "<gold>Kill Limit: {value}"
        lore:
          - "<gray>0 = off"
          - "<gray>Left-click: cycle"
          - "<gray>Right-click: enter amount"
        prompt: "Enter the kill limit ({min}-{max}, 0 = off):"
      win-all:
        "on": "<green>Win: Whole Team Evolved"
        on-lore:
          - "<gray>Every teammate must finish their order"
        "off": "<red>Win: First Player Evolved"
        off-lore:
          - "<gray>First finished player wins it for the team"
      start-hp:
        name: "<gold>Start HP: {value}"
        lore:
          - "<gray>Left-click: cycle"
          - "<gray>Right-click: enter amount"
        prompt: "Enter the starting HP ({min}-{max}):"
      shared-order:
        "on": "<green>Shared Hero Order: Enabled"
        on-lore:
          - "<gray>Everyone gets the same shuffled order"
        "off": "<red>Shared Hero Order: Disabled"
        off-lore:
          - "<gray>Each player gets their own shuffled order"
      ult-carryover:
        "on": "<green>Ult Charge Carryover: Enabled"
        on-lore:
          - "<gray>Smash charge % carries across hero swaps"
        "off": "<red>Ult Charge Carryover: Disabled"
        off-lore:
          - "<gray>Each new hero starts its ult from zero"

    series:
      title: "Series Settings"
      best-of:
        name: "<gold>Best of: {value} (first to {wins})"
        lore:
          - "<gray>Left-click: cycle 3/5/7"
          - "<gray>Right-click: enter amount"
        prompt: "Enter the series length ({min}-{max}, odd recommended):"
      repick:
        "on": "<green>Hero Re-Pick Between Rounds: Enabled"
        on-lore: []
        "off": "<red>Hero Re-Pick Between Rounds: Disabled"
        off-lore: []

    boss:
      title: "Boss Mode Settings"
      head-boss-lore:
        - "<red>THE BOSS"
      head-pick-lore:
        - "<gray>Click to make boss"
      hp-per-life:
        name: "<gold>Boss HP Per Life: {value}"
        lore:
          - "<gray>Starting/max HP the boss respawns"
          - "<gray>with on every one of its lives"
          - "<gray>Left-click: cycle"
          - "<gray>Right-click: enter amount"
        prompt: "Enter the boss HP per life ({min}-{max}):"
      non-boss-lives:
        name: "<gold>Non-Boss Lives: {value}"
        lore:
          - "<gray>Left-click: cycle"
          - "<gray>Right-click: enter amount"
        prompt: "Enter the non-boss lives ({min}-{max}):"
      non-boss-hp:
        name: "<gold>Non-Boss HP: {value}"
        lore:
          - "<gray>Left-click: cycle"
