# Progression tuning. The xp.curve list is the source of truth for leveling:
# entry N (1-indexed) is the XP needed to go from level N-1 to level N, and the
# list length is the max hero level.

xp:
  game-reward: 40      # participation XP, everyone who finishes a game
  kill-reward: 20
  win-reward: 40       # bonus on top of game-reward for winners
  assist-reward: 0
  custom-multiplier: 0.5   # all XP in CUSTOM games is scaled by this
  curve: [60, 70, 80, 110, 160, 210, 280, 360, 450, 550,
          670, 790, 930, 1080, 1250, 1420, 1610, 1810, 2020, 2250,
          2250, 2250, 2250, 2250, 2250, 2250, 2250, 2250, 2250, 2250,
          2250, 2250, 2250, 2250, 2250, 2250, 2250, 2250, 2250, 2250,
          2250, 2250, 2250, 2250, 2250, 2250, 2250, 2250, 2250, 2250]

levels:
  master-skin-level: 20
  token-every-n-levels: 5

unlocks:
  starting-heroes:
    - shoop
    - spooderman
    - bulk
    - tinman
    - cryomancer
  starting-tokens: 2
