# Template-level defaults. Every value here applies to all heroes unless the hero's own yml sets the
# same key on the ability; default.yml stays hero-specific (stats, mobility, jab). Units are in the
# key name or the comment.
ability:
  name: "Unknown Ability"
  description: ""
  cooldown: 0.0            # seconds
  active_duration: 0.0     # seconds
  energy_cost: 0
  charges: 0
  damage: 0.0
  knockback: 0.0
  radius: 0.0
  windup: 0.0              # seconds between a successful cast and the ability performing
  cooldown_starts: CAST    # CAST | RESOLVE (when cooldown begins for deferred-cooldown kits)
  miss_cooldown: -1.0      # seconds applied by resolveMissCooldown() (< 0 = use full cooldown)
  charge_on_primary_hit: false
  ult_charge_ms:           # SMASH cooldown removed per hit, by hero type and hit kind
    melee_jab: 3000
    hybrid_jab: 1000
    ranged_ability: 2000
    hybrid_ability: 1000
    melee_ability: 0
    ranged_jab: 0

active:
  aura_interval: 10        # ticks between ActiveAbility aura_visual emissions

ranged:
  range: 50.0
  pierces_players: false
  pierces_walls: false
  kb_type: DIRECTION
  min_damage: 0.0
  dropoff_distance: 0.0
  spread_deg: 0.0
  spread_alternate: false
  burst_count: 1
  burst_delay_ms: 0
  burst_start_delay_ms: 0
  burst_until_inactive: false
  hit_interval_ticks: 0
  trail_spacing: 1.0
  trail_spacing_distance: 0.0
  trail_persists: false

projectile:
  speed: 1.0
  gravity: 0.0
  trail_spacing: 2.0
  returns: false           # true for boomerangs / returning shields
  catch_radius: 1.5        # blocks from owner to catch returning projectile
  return_range_mult: 2.0   # max return distance = flightRange * return_range_mult
  spin_deg_per_tick: 0.0   # local-Y display spin per tick

cone:
  range: 5.0
  min_radius: 0.0
  spacing: 1.0
  pierces_walls: false
  replay_delay_ticks: -1   # -1 = linger midpoint; 0 = disabled

dash:
  speed: 3.0
  duration: 7              # ticks
  trail_spacing: 2         # ticks
  hitbox_grace_ticks: 5
  exit_velocity_factor: 0.0   # fraction of the dash velocity kept when it ends (0 = dead stop)
  vertical_knockback: 0.0
  kb_reverse: false

shockwave:
  height: 2.0
  pierces_walls: false
  show_block_wave: true

tether:
  tether_distance: 15.0

aoe:
  pierces_walls: false
  kb_type: POSITIONAL

minion:
  grants_charge: 0.0       # fraction of on-hit resource gain a hit on this minion grants
                           # (ult charge is scaled; whole-number gains such as ability charges or
                           # ammo are granted with this probability)

bot:
  strategy:
    aggressive:
      ability_range: 5.0
      far_distance: 15.0
    defensive:
      ability_range: 10.0
      far_distance: 15.0
      panic_distance: 0.0
    midrange:
      ability_range: 7.0
      far_distance: 12.0
      panic_distance: 0.0
    ult_min_target_hp_percent: 0.0
    ult_min_self_hp_percent: 0.0

visual:
  shape: POINT
  offset:
    x: 0.0
    y: 0.0
    z: 0.0
  particle:
    count: 1
    extra: 0.0
    spread: 0.0
    size: 1.0
    radius: 1.0
    points: 12
    step: 0.5
  display:
    scale: 1.0
    duration: 20             # ticks for one-shot displays
    step: 0.5                # blocks between LINE display segments
    model_back_offset: 0.0   # blocks from model pivot back to rear face along forward axis
    transform: HEAD

sound:
  volume: 1.0
  pitch: 1.0
  pitch_variation: 0.0
  scope: LOCAL

status:
  presets:
    stun:
      move: false
      jump: false
      abilities: true
      jab: true
      hold: false
      break_on_knockback: true
      indicator_sound:
        sound: "block.anvil.land"        # FILL
        volume: 0.6                      # FILL
        pitch: 1.6                       # FILL
        scope: PLAYER
    pin:
      move: false
      jump: false
      abilities: true
      jab: true
      hold: true
      break_on_knockback: false
      indicator_sound:
        sound: "block.chain.place"       # FILL
        volume: 0.8                      # FILL
        pitch: 0.8                       # FILL
        scope: PLAYER
    root:
      move: true
      jump: false
      abilities: true
      jab: true
      hold: false
      break_on_knockback: false
      indicator_sound:
        sound: "block.rooted_dirt.place" # FILL
        volume: 0.8                      # FILL
        pitch: 0.9                       # FILL
        scope: PLAYER
    disable:
      move: true
      jump: true
      abilities: false
      jab: false
      hold: false
      break_on_knockback: false
      indicator_sound:
        sound: "entity.elder_guardian.curse" # FILL
        volume: 0.5                          # FILL
        pitch: 1.8                           # FILL
        scope: PLAYER

